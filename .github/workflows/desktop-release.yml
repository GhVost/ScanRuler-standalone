# SPDX-License-Identifier: AGPL-3.0-only
# The Windows desktop build, for releases only: push a tag desktop-v<version>
# (the version desktop/package.json carries) and the tests run, the portable
# exe and the installer are built, and both are attached to a GitHub release
# of that tag. Everyday builds are made locally (desktop/README.md).
name: Desktop release

on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: The tag names the version being built
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          [ "$GITHUB_REF_NAME" = "desktop-v$version" ] ||
            { echo "::error::tag $GITHUB_REF_NAME but desktop/package.json says $version"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: desktop
      - run: npm run dist -- --publish never
        working-directory: desktop
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" desktop/release/*.exe \
            --title "ScanRuler desktop ${GITHUB_REF_NAME#desktop-v}" \
            --notes "Windows build of ScanRuler ${GITHUB_REF_NAME#desktop-v}: a portable exe (no install) and an installer. Not code-signed: Windows SmartScreen warns on first run (More info → Run anyway)."
